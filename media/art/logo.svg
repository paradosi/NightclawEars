<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Nightclaw Ears logo: a gold crescent moon torn by three claw marks, on wowdb.dev's navy.
       Source for media/art/logo_400.png, logo_64.png and media/textures/logo_64.tga. -->
  <defs>
    <radialGradient id="well" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#232b42"/>
      <stop offset="0.6" stop-color="#161b29"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3ad"/>
      <stop offset="0.45" stop-color="#e3b664"/>
      <stop offset="1" stop-color="#9c7130"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d595"/>
      <stop offset="0.5" stop-color="#e3b664" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3d595" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3b664" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e3b664" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="400" height="400" fill="#000"/>
      <circle cx="200" cy="200" r="122" fill="#fff"/>
      <circle cx="252" cy="164" r="104" fill="#000"/>
    </mask>
    <mask id="torn">
      <rect width="400" height="400" fill="#fff"/>
      <!-- three claw marks cut through the moon -->
      <g fill="#000">
        <path d="M56 130 C118 170 162 248 170 326 C150 256 108 184 56 130 Z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <path d="M94 98 C156 138 200 216 208 294 C188 224 146 152 94 98 Z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <path d="M136 76 C198 116 242 194 250 272 C230 202 188 130 136 76 Z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="368" height="368" rx="42" fill="url(#rim)"/>
  <rect x="22" y="22" width="356" height="356" rx="37" fill="url(#well)"/>
  <circle cx="190" cy="210" r="170" fill="url(#glow)"/>

  <g filter="url(#shadow)" mask="url(#torn)">
    <rect width="400" height="400" fill="url(#gold)" mask="url(#crescent)"/>
  </g>
  <!-- two stars -->
  <g fill="#f3d595">
    <path d="M300 92 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M326 168 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.7"/>
  </g>
</svg>
